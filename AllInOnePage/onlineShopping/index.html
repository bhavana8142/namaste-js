<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      h1 {
        text-align: center;
      }
      .online-shopping-container {
        max-width: 800px;
        background-color: white;
        margin: 10px auto;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0 4px 8px 0 rgb(189, 189, 189);
      }
      h2 {
        margin: 10px 0px;
      }
      body {
        background-color: rgb(231, 233, 233);
      }
      .product-row {
        display: flex;
        justify-content: space-between;
        border: 1px solid black;
        padding: 10px;
        border-radius: 5px;
        align-items: center;
        margin: 10px 0;
      }
      button {
        background-color: blue;
        border: none;
        padding: 10px 20px;
        color: white;
        border-radius: 5px;
      }
      button:hover {
        background-color: pink;
        cursor: pointer;
      }
      #feedback{
      
        position: fixed;
        top: 20px ;
        right: 20px;
        background-color: white;
        padding: 10px;
        display: none;
        color: white;
     
      }
      #totalPrice{
        text-align: end;
      }
    </style>
  </head>
  <body>
    <div class="online-shopping-container">
      <h1>Online Shopping</h1>
      <h2> Happy Shopping!!</h2>
      <p id ="feedback"> </p>
      <h2>Available Products</h2>
      <div id ="product-container">
        
      </div>
      <h2>My Cart</h2>
      <div id ="Remove-container">
        
      </div>
      <h2 id ="totalPrice"></h2>
      <h2>Actions</h2>
      <button  id = "sortCarts"> Sort by price</button>
      <button id = clearCart>clear cart</button>
     

    </div>

    <script src="script.js"></script>
  </body>
</html>
