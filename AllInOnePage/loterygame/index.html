<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .con {
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
      }
      .box {
        height: 40px;
        width: 180px;
        background-color: yellow;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        font-size: 20px;
        margin: 5px;
      }
      .lotery-container{
        display: flex;
        flex-wrap:wrap ;
        justify-content: center;
      }
      .winningBox{
        background-color: green;
        color: white;
      }
      .highlitedBox{
         border-color: red;
        border-width: 2px;
        border-style: solid;

        
       
       
      }
      #number{
        background-color: purple;
        border-radius: 5px;
        padding: 20px;
        border: none;
        color: white;

      }
      #number:hover{
        background-color: blueviolet;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">Lottery Game</h1>
    <div class="con">
      <div class="lotery-container" id ="loteryCon">
        <!-- <div class="box winningBox">100 Rs cash back</div> -->
        
      </div>

      <h2 id="res"></h2>
      <button id="number">pick a number</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
